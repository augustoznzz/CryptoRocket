<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#0c0c0c">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="mobile-web-app-capable" content="yes">
    <!-- Force dark background via meta -->
    <style>html{background:#0c0c0c!important}body{background:#0c0c0c!important}</style>
    <title>Crypto Rocket - Análise em Tempo Real</title>
    
    <!-- EXECUTE IMMEDIATELY - Before any other script -->
    <script>
        // Execute IMMEDIATELY on parse, not waiting for DOMContentLoaded
        (function() {
            const darkColor = '#0c0c0c';
            const darkGradient = 'linear-gradient(135deg, #0c0c0c 0%, #1a1a1a 100%)';
            
            // Apply styles to html and body IMMEDIATELY
            if (document.documentElement) {
                document.documentElement.style.backgroundColor = darkColor;
                document.documentElement.style.background = darkGradient;
            }
            
            // Set viewport height immediately
            const setInitialHeight = function() {
                const vh = window.visualViewport ? window.visualViewport.height : window.innerHeight;
                if (window.innerWidth <= 768) {
                    document.documentElement.style.height = vh + 'px';
                    if (document.body) {
                        document.body.style.backgroundColor = darkColor;
                        document.body.style.background = darkGradient;
                        document.body.style.height = vh + 'px';
                        document.body.style.position = 'fixed';
                        document.body.style.top = '0';
                        document.body.style.left = '0';
                        document.body.style.right = '0';
                        document.body.style.bottom = '0';
                        document.body.style.overflow = 'hidden';
                        document.body.style.margin = '0';
                        document.body.style.padding = '0';
                    }
                }
            };
            
            // Execute immediately
            setInitialHeight();
            
            // Execute again when DOM is interactive (before DOMContentLoaded)
            if (document.readyState === 'loading') {
                document.addEventListener('readystatechange', function() {
                    if (document.readyState === 'interactive') {
                        setInitialHeight();
                    }
                });
            }
            
            // Also execute on DOMContentLoaded as backup
            document.addEventListener('DOMContentLoaded', setInitialHeight);
        })();
    </script>
    
    <style>
        /* Dark Theme Crypto Trading Interface */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        /* ULTRA PROTECTION - Force dark background on root */
        :root {
            background-color: #0c0c0c !important;
            background: linear-gradient(135deg, #0c0c0c 0%, #1a1a1a 100%) !important;
        }

        /* Prevent any white space from appearing */
        *:not(.trade-card):not(.signal-type):not(.search-button) {
            border-color: #0c0c0c !important;
        }

        /* Ensure full screen coverage - RADICAL APPROACH */
        html {
            background-color: #0c0c0c !important; /* Solid fallback */
            background: linear-gradient(135deg, #0c0c0c 0%, #1a1a1a 100%) !important;
            min-height: 100vh;
            min-height: 100dvh;
            min-height: -webkit-fill-available;
            height: 100%;
            width: 100%;
            overflow: hidden;
            overflow-y: auto;
            /* REMOVIDO: Safe area padding - estava criando espaços brancos */
            /* Prevent bounce scroll white bars */
            overscroll-behavior: none;
            overscroll-behavior-y: none;
            /* Force GPU rendering for immediate display */
            transform: translateZ(0);
            -webkit-transform: translateZ(0);
            will-change: background;
        }

        /* Layer 1 - Deepest protection layer - covers EVERYTHING with extra space */
        html::before {
            content: '';
            position: fixed;
            top: -100px;
            left: -100px;
            right: -100px;
            bottom: -100px;
            width: calc(100% + 200px);
            height: calc(100% + 200px);
            background-color: #0c0c0c;
            background: linear-gradient(135deg, #0c0c0c 0%, #1a1a1a 100%);
            z-index: -1000;
            pointer-events: none;
        }

        html, body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background-color: #0c0c0c !important; /* Solid fallback */
            background: linear-gradient(135deg, #0c0c0c 0%, #1a1a1a 100%) !important;
            color: #e0e0e0;
            min-height: 100vh;
            min-height: 100dvh; /* Dynamic viewport height for mobile */
            min-height: -webkit-fill-available;
            line-height: 1.6;
            position: relative;
            overflow-x: hidden;
            /* Force full coverage */
            height: 100%;
            width: 100%;
            /* Prevent bounce scroll white bars */
            overscroll-behavior: none;
            overscroll-behavior-y: none;
            /* Force GPU rendering for immediate display */
            transform: translateZ(0);
            -webkit-transform: translateZ(0);
            will-change: background;
            backface-visibility: hidden;
            -webkit-backface-visibility: hidden;
        }

        /* Layer 2 - Body before - intermediate protection */
        body::before {
            content: '';
            position: fixed;
            top: -50px;
            left: -50px;
            right: -50px;
            bottom: -50px;
            width: calc(100% + 100px);
            height: calc(100% + 100px);
            background-color: #0c0c0c;
            background: linear-gradient(135deg, #0c0c0c 0%, #1a1a1a 100%);
            z-index: -500;
            pointer-events: none;
        }

        /* Layer 3 - Body after - extra top/bottom coverage */
        body::after {
            content: '';
            position: fixed;
            top: -200px;
            left: 0;
            right: 0;
            height: calc(100% + 400px);
            width: 100%;
            background-color: #0c0c0c;
            background: linear-gradient(135deg, #0c0c0c 0%, #1a1a1a 100%);
            z-index: -100;
            pointer-events: none;
        }
        
        /* Particles Canvas - FUNDO ÚNICO COM PARTÍCULAS */
        #particles-canvas {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            width: 100%;
            min-height: 100vh;
            min-height: 100dvh;
            min-height: -webkit-fill-available;
            height: 100dvh;
            z-index: 0;
            pointer-events: none;
            touch-action: none;
            background-color: #0c0c0c; /* Solid fallback */
            background: linear-gradient(135deg, #0c0c0c 0%, #1a1a1a 100%); /* Fundo único aqui */
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 2rem;
            min-height: 100vh;
            min-height: 100dvh;
            display: flex;
            flex-direction: column;
            background: transparent;
            position: relative;
            z-index: 1;
        }

        header {
            text-align: center;
            margin-bottom: 3rem;
            padding: 2rem 0;
            background: transparent;

        }

        .search-section {

            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: transparent;

        .search-button {
            position: relative;
            background: linear-gradient(135deg, #00ff9d 0%, #00b8ff 100%);
            border: none;
            border-radius: 16px;
            padding: 1.5rem 3rem;
            font-size: 1.2rem;
            font-weight: 600;
            color: #000;
            cursor: pointer;

            text-transform: uppercase;

            overflow: hidden;

            min-height: 60px;

            align-items: center;
            justify-content: center;
        }

        .search-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 40px rgba(0, 255, 157, 0.3);
            background: linear-gradient(135deg, #00ff9d 0%, #00d4ff 100%);

        .search-button:active {
            transform: translateY(0);
        }

        .search-button:disabled {
            opacity: 0.7;
            cursor: not-allowed;
            transform: none;
        }

        .button-text {
            transition: opacity 0.3s ease;
        }

        .loading-spinner {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
        }

        .spinner {
            width: 24px;
            height: 24px;
            border: 3px solid transparent;
            border-top: 3px solid #000;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .subtitle {
            margin-top: 1.5rem;
            color: #888;
            font-size: 1rem;
            font-weight: 300;
        }

        /* Results Section */
        .results-section {
            margin-top: 3rem;
            animation: fadeInUp 0.6s ease-out;
            background: transparent;
        }

        .results-section h2 {
            text-align: center;
            margin-bottom: 2rem;
            color: #00ff9d;
            font-size: 1.8rem;
        }

        .results-container {
            display: grid;
            gap: 1.5rem;
            margin-bottom: 2rem;
            background: transparent;
        }

        .trade-card {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 16px;
            padding: 1.5rem;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
            width: 85%; /* Reduzindo 15% da largura */
            margin: 0 auto; /* Centralizar as caixas */
        }

        .trade-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 3px;
            background: linear-gradient(135deg, #00ff9d 0%, #00b8ff 100%);
        }

        .trade-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 20px 40px rgba(0, 255, 157, 0.1);
            border-color: rgba(0, 255, 157, 0.3);
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1rem;
        }

        .crypto-symbol {
            font-size: 1.3rem;
            font-weight: 700;
            color: #ffffff;
        }

        .signal-type {
            padding: 0.5rem 1rem;
            border-radius: 8px;
            font-weight: 600;
            font-size: 0.9rem;
        }

        .signal-long {
            background: rgba(0, 255, 157, 0.2);
            color: #00ff9d;
            border: 1px solid rgba(0, 255, 157, 0.3);
        }

        .signal-short {
            background: rgba(255, 82, 82, 0.2);
            color: #ff5252;
            border: 1px solid rgba(255, 82, 82, 0.3);
        }

        .signal-neutral {
            background: rgba(255, 204, 0, 0.2);
            color: #ffcc00;
            border: 1px solid rgba(255, 204, 0, 0.3);
        }

        .potential-gain {
            font-size: 1.1rem;
            font-weight: 600;
            color: #00ff9d;
            margin-bottom: 1rem;
        }

        .trade-details {
            background: rgba(0, 0, 0, 0.3);
            border-radius: 12px;
            padding: 1rem;
            font-family: 'Fira Code', monospace;
            font-size: 0.9rem;
            white-space: pre-line;
            line-height: 1.8;
            color: #e0e0e0;
            border-left: 3px solid #00ff9d;
        }

        .analysis-info {
            text-align: center;
            padding: 1.5rem;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 12px;
            margin-top: 2rem;
        }

        .analysis-info p {
            color: #a0a0a0;
            margin: 0.5rem 0;
        }

        /* Error Section */
        .error-section {
            text-align: center;
            margin-top: 3rem;
            padding: 2rem;
            background: rgba(255, 82, 82, 0.1);
            border: 1px solid rgba(255, 82, 82, 0.3);
            border-radius: 12px;
            animation: fadeInUp 0.6s ease-out;
        }

        .error-section h2 {
            color: #ff5252;
            margin-bottom: 1rem;
        }

        /* Footer */
        footer {
            text-align: center;
            padding: 2rem 0;
            margin-top: 3rem;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            color: #666;
            font-size: 0.9rem;
            background: transparent;
        }

        /* Animations */
        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Responsive Design - RADICAL MOBILE FIX */
        @media (max-width: 768px) {
            html {
                background-color: #0c0c0c !important;
                background: linear-gradient(135deg, #0c0c0c 0%, #1a1a1a 100%) !important;
                /* REMOVIDO: background-attachment: fixed - não funciona em mobile */
                overflow: hidden !important;
                overflow-y: hidden !important;
                min-height: 100vh !important;
                min-height: 100dvh !important;
                min-height: -webkit-fill-available !important;
                height: 100vh !important;
                height: 100dvh !important;
                max-height: 100vh !important;
                width: 100vw !important;
                margin: 0 !important;
                padding: 0 !important;
            }
            
            /* TÉCNICA RADICAL: Body fixo para prevenir bounce scroll branco */
            body {
                background-color: #0c0c0c !important;

                top: 0 !important;
                left: 0 !important;
                right: 0 !important;
                bottom: 0 !important;
                overflow: hidden !important; /* No scroll on body */
                width: 100vw !important;
                height: 100vh !important;

                min-height: 100vh !important;

                margin: 0 !important;
                padding: 0 !important;

            /* Container scrollável - scroll interno em vez do body */
            .container {
                position: absolute !important; /* KEY FIX */
                top: 0;
                left: 0;
                right: 0;
                bottom: 0;
                padding: 1rem;
                background: transparent;

            /* Force dark on ALL structural elements in mobile */
            html, body, #absolute-background {

                margin: 0 !important;

                border: none !important;

                margin: 0 !important;

            }

        /* Mobile-specific fixes - Small devices */
        @media (max-width: 480px) {
            html {
                background-color: #0c0c0c !important;
                background: linear-gradient(135deg, #0c0c0c 0%, #1a1a1a 100%) !important;

                background-color: #0c0c0c !important;
                background: linear-gradient(135deg, #0c0c0c 0%, #1a1a1a 100%) !important;

                /* Body já está fixo no media query 768px */
                min-height: 100vh;
                min-height: 100dvh;
                min-height: -webkit-fill-available;
                height: 100%;
            }
            
            .container {
                padding: 0.5rem;
                background: transparent;
                /* Container já está scrollável no media query 768px */
            }
            
            .trade-card {
                width: 100%;
                margin: 0 0 1rem 0;
                background: rgba(255, 255, 255, 0.05);
            }
            
            .search-button {
                min-width: 200px;
                padding: 1rem 1.5rem;
                font-size: 1rem;
            }
        }

        /* Scrollbar Styling */
        ::-webkit-scrollbar {
            width: 8px;
        }

        ::-webkit-scrollbar-track {
            background: #1a1a1a;
        }

        ::-webkit-scrollbar-thumb {
            background: #404040;
            border-radius: 4px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: #606060;
        }
        
        /* Force dark background on all elements */
        main {
            background: transparent;
        }
        
        #results, #error {
            background: transparent;
        }
        
        /* Ensure no white backgrounds */
        *[style*="background: white"], *[style*="background: #fff"], *[style*="background-color: white"], *[style*="background-color: #fff"] {
            background: rgba(255, 255, 255, 0.05) !important;
        }
        
        /* Additional mobile fixes */
        @supports (-webkit-touch-callout: none) {
            /* iOS Safari specific */
            html, body {
                min-height: -webkit-fill-available;
                height: 100%;
            }
            
            #particles-canvas {
                min-height: -webkit-fill-available;
                height: 100%;
            }
        }
        
        /* Cobertura extra para dispositivos muito pequenos */
        @media (max-width: 480px) {
            #particles-canvas {
                position: fixed;
                inset: 0;
                width: 100vw !important;
                min-height: 100vh;
                min-height: 100dvh;
                min-height: -webkit-fill-available;
            }
        }
        
        /* Landscape mode mobile */
        @media (max-width: 768px) and (orientation: landscape) {
            #particles-canvas {
                min-height: 100vh;
                min-height: 100dvh;
                height: 100vh;
                height: 100dvh;
            }
        }
    </style>

<body>
    <!-- CAMADA DE PROTEÇÃO ABSOLUTA - DIV FUNDO -->

    <!-- Canvas de Partículas - SISTEMA FUNCIONAL -->
    <canvas id="particles-canvas"></canvas>
    
    <div class="container">
        <header>
            <h1><img class="logo-icon" src="static/img/logocryptorocket.png" alt="" /> Crypto Rocket</h1>

            <p style="margin-top: 0.5rem; font-size: 0.8rem; color: #888;">
                Data provided by CoinGecko API • Technical analysis calculated in real time
            </p>
        </footer>
    </div>

    <!-- EXECUTE IMMEDIATELY WHEN BODY EXISTS -->
    <script>
        // Execute as soon as this script tag is parsed (body exists now)
        (function() {
            const darkColor = '#0c0c0c';
            const darkGradient = 'linear-gradient(135deg, #0c0c0c 0%, #1a1a1a 100%)';
            const vh = window.visualViewport ? window.visualViewport.height : window.innerHeight;
            
            if (window.innerWidth <= 768) {
                document.documentElement.style.setProperty('background-color', darkColor, 'important');
                document.documentElement.style.setProperty('background', darkGradient, 'important');
                document.documentElement.style.setProperty('height', vh + 'px', 'important');
                document.documentElement.style.setProperty('overflow', 'hidden', 'important');
                
                document.body.style.setProperty('background-color', darkColor, 'important');
                document.body.style.setProperty('background', darkGradient, 'important');
                document.body.style.setProperty('position', 'fixed', 'important');
                document.body.style.setProperty('top', '0', 'important');
                document.body.style.setProperty('left', '0', 'important');
                document.body.style.setProperty('right', '0', 'important');
                document.body.style.setProperty('bottom', '0', 'important');
                document.body.style.setProperty('overflow', 'hidden', 'important');
                document.body.style.setProperty('height', vh + 'px', 'important');
                document.body.style.setProperty('width', '100vw', 'important');
                document.body.style.setProperty('margin', '0', 'important');
                document.body.style.setProperty('padding', '0', 'important');
            }
        })();

    <script>
        // Crypto Rocket - Frontend JavaScript (Version with Netlify Real Analysis)

        document.addEventListener('DOMContentLoaded', function() {
            const buttonText = document.querySelector('.button-text');
            const loadingSpinner = document.querySelector('.loading-spinner');
            const resultsSection = document.getElementById('results');
            const resultsContainer = document.getElementById('resultsContainer');
            const analysisInfo = document.getElementById('analysisInfo');
            const errorSection = document.getElementById('error');
            const errorMessage = document.getElementById('errorMessage');

            // RADICAL MOBILE FIX - Calculate and apply exact viewport height
            function setExactHeight() {
                // Get real viewport height using visualViewport API (iOS Safari compatible)
                const vh = window.visualViewport ? 
                    window.visualViewport.height : 
                    window.innerHeight;
                
                const vw = window.innerWidth;
                
                // Apply exact height to prevent white spaces

        // SISTEMA DE PARTÍCULAS NO ESTILO SOLICITADO

        function initParticlesSystem() {
            console.log('🚀 Inicializando sistema de partículas no estilo solicitado...');
            
            const canvas = document.getElementById('particles-canvas');
            if (!canvas) {
                console.error('❌ Canvas não encontrado!');
                return;
            }
            
            console.log('✅ Canvas encontrado:', canvas);
            
            const ctx = canvas.getContext('2d');
            if (!ctx) {
                console.error('❌ Contexto 2D não disponível!');
                return;
            }
            
            console.log('✅ Contexto 2D OK:', ctx);
            
            // Configurações das partículas no estilo solicitado
            const particles = [];
            const particleCount = 150; // Quantidade otimizada para o estilo
            const color = '#90EE90'; // Verde claro suave
            
            // Converter hex para RGB para transparência
            function hexToRgb(hex) {
                hex = hex.replace("#", "");
                if (hex.length === 3) {
                    hex = hex.split("").map(char => char + char).join("");
                }
                const hexInt = parseInt(hex, 16);
                const red = (hexInt >> 16) & 255;
                const green = (hexInt >> 8) & 255;
                const blue = hexInt & 255;
                return [red, green, blue];
            }
            
            const rgb = hexToRgb(color);
            
            // Configurar canvas com suporte mobile completo
            function resizeCanvas() {
                // Get real viewport dimensions (important for mobile)
                const getViewportDimensions = () => {
                    if (window.visualViewport) {
                        return {
                            width: window.visualViewport.width,
                            height: window.visualViewport.height
                        };
                    }
                    return {
                        width: window.innerWidth,
                        height: window.innerHeight
                    };
                };
                
                const viewport = getViewportDimensions();
                canvas.width = viewport.width;
                canvas.height = viewport.height;
                
                // Also update canvas style to ensure visual coverage
                canvas.style.width = '100%';
                canvas.style.height = `${viewport.height}px`;
                canvas.style.minHeight = '100vh';
                canvas.style.minHeight = '-webkit-fill-available';
                
                console.log('📐 Canvas redimensionado para:', canvas.width, 'x', canvas.height);
            }
            
            // Criar partículas no estilo solicitado
            function createParticles() {
                particles.length = 0; // Limpar array
                for (let i = 0; i < particleCount; i++) {
                    particles.push({
                        x: Math.random() * canvas.width,
                        y: Math.random() * canvas.height,
                        translateX: 0,
                        translateY: 0,
                        size: Math.random() * 1.5 + 0.5, // Tamanho pequeno e sutil (0.5-2px)
                        alpha: 0,
                        targetAlpha: Math.random() * 0.6 + 0.1, // Opacidade sutil
                        dx: (Math.random() - 0.5) * 0.1, // Movimento muito suave
                        dy: (Math.random() - 0.5) * 0.1,
                        magnetism: 0.1 + Math.random() * 4 // Magnetismo para interação com mouse
                    });
                }
                console.log('✨ Partículas criadas:', particles.length);
            }
            
            // Função para mapear valores (como no código React)
            function remapValue(value, start1, end1, start2, end2) {
                const remapped = ((value - start1) * (end2 - start2)) / (end1 - start1) + start2;
                return remapped > 0 ? remapped : 0;
            }
            
            // Animar partículas no estilo solicitado
            function animateParticles() {
                // Limpar canvas
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                
                // Desenhar partículas
                particles.forEach((particle, i) => {
                    // Calcular bordas para efeito de fade
                    const edge = [
                        particle.x + particle.translateX - particle.size,
                        canvas.width - particle.x - particle.translateX - particle.size,
                        particle.y + particle.translateY - particle.size,
                        canvas.height - particle.y - particle.translateY - particle.size
                    ];
                    const closestEdge = edge.reduce((a, b) => Math.min(a, b));
                    const remapClosestEdge = parseFloat(remapValue(closestEdge, 0, 20, 0, 1).toFixed(2));
                    
                    // Gerenciar alpha para efeito suave
                    if (remapClosestEdge > 1) {
                        particle.alpha += 0.02;
                        if (particle.alpha > particle.targetAlpha) {
                            particle.alpha = particle.targetAlpha;
                        }
                    } else {
                        particle.alpha = particle.targetAlpha * remapClosestEdge;
                    }
                    
                    // Atualizar posição
                    particle.x += particle.dx;
                    particle.y += particle.dy;
                    
                    // Interação com mouse (magnetismo)
                    const mouseX = (window.innerWidth / 2) - particle.x;
                    const mouseY = (window.innerHeight / 2) - particle.y;
                    particle.translateX += (mouseX / (50 / particle.magnetism) - particle.translateX) / 50;
                    particle.translateY += (mouseY / (50 / particle.magnetism) - particle.translateY) / 50;
                    
                    // Desenhar partícula principal
                    ctx.save();
                    ctx.translate(particle.translateX, particle.translateY);
                    ctx.beginPath();
                    ctx.arc(particle.x, particle.y, particle.size, 0, Math.PI * 2);
                    
                    // Cor principal com transparência
                    ctx.fillStyle = `rgba(${rgb.join(", ")}, ${particle.alpha})`;
                    ctx.fill();
                    
                    // Borda minimamente brilhante (muito sutil)
                    ctx.strokeStyle = `rgba(${rgb.join(", ")}, ${particle.alpha * 0.3})`;
                    ctx.lineWidth = 0.5;
                    ctx.stroke();
                    
                    // Efeito de brilho interno muito sutil
                    ctx.beginPath();
                    ctx.arc(particle.x, particle.y, particle.size * 0.6, 0, Math.PI * 2);
                    ctx.fillStyle = `rgba(${rgb.join(", ")}, ${particle.alpha * 0.2})`;
                    ctx.fill();
                    
                    ctx.restore();
                    
                    // Verificar se a partícula saiu da tela
                    if (particle.x < -particle.size || 
                        particle.x > canvas.width + particle.size ||
                        particle.y < -particle.size || 
                        particle.y > canvas.height + particle.size) {
                        
                        // Recriar partícula em nova posição
                        particle.x = Math.random() * canvas.width;
                        particle.y = Math.random() * canvas.height;
                        particle.translateX = 0;
                        particle.translateY = 0;
                        particle.alpha = 0;
                    }
                });
                
                // Continuar animação
                requestAnimationFrame(animateParticles);
            }
            
            // Inicializar sistema
            resizeCanvas();
            createParticles();
            animateParticles();
            
            console.log('🎉 Sistema de partículas no estilo solicitado iniciado com sucesso!');
            console.log('📊 Total de partículas:', particles.length);
