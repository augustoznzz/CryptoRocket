[build]
  publish = "."
  command = "echo 'Build completed - Real-time crypto analysis ready'"
  functions = "netlify/functions"

[[redirects]]
  from = "/ml/infer"
  to = "/.netlify/functions/ml-infer"
  status = 200

[[redirects]]
  from = "/ai-sentiment/analyze"
  to = "/.netlify/functions/ai-sentiment-analyze"
  status = 200

[[redirects]]
  from = "/"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[build.environment]
  NODE_VERSION = "18"

[functions]
  node_bundler = "esbuild"
